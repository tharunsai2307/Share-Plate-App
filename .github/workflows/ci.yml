name: SharePlate Production CI/CD Pipeline

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 1. Monorepo Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Domain Package
        run: npm run build -w packages/shared

      - name: Run All Automated Unit & Concurrency Tests
        run: npm test

      - name: Strict TypeScript Typecheck Across All Workspaces
        run: npm run typecheck

      - name: Build Production Admin Web Application
        run: npm run build -w apps/admin

  security:
    name: 2. Security & RLS Compliance Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Hardcoded Secrets in SQL Migrations
        run: |
          if grep -rn "eyJ" supabase/migrations/; then
            echo "::error::Hardcoded JWT token detected in SQL migrations!"
            exit 1
          fi
          echo "Zero hardcoded JWT tokens in migrations."

      - name: Verify Row Level Security (RLS) on Database Tables
        run: |
          echo "Verifying RLS enablement across all core tables in migration 002..."
          grep -q "ENABLE ROW LEVEL SECURITY" supabase/migrations/20261016000002_rls_policies.sql
          echo "RLS enforcement verified."

      - name: Verify Realtime Publications for Two-Way Continuous Sync
        run: |
          echo "Verifying Realtime publication migration..."
          grep -q "ALTER PUBLICATION supabase_realtime ADD TABLE" supabase/migrations/20261016000004_realtime_publications.sql
          echo "Realtime publication verified."

  deploy-admin-preview:
    name: 3. Admin Production Bundle Verification
    needs: [validate, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Production Build Artifacts
        run: |
          npm run build -w apps/admin
          test -d apps/admin/.next && echo "Production build artifacts successfully verified."

  deploy-mobile-eas:
    name: 4. Mobile EAS Update (Production Channel)
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' && env.EXPO_TOKEN != ''
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish Over-The-Air (OTA) EAS Update to Production
        working-directory: apps/mobile
        run: npx eas update --auto --channel production
